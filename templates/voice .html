<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chatbot - Unity Public School</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #e3ffe7, #d9e7ff);
            color: #333;
            margin: 0;
            padding: 0;
        }

        .chatbot {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 60px;
            height: 60px;
            background-color: #007bff;
            color: white;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 28px;
            cursor: pointer;
            box-shadow: 0px 4px 15px rgba(0, 0, 0, 0.3);
            transition: transform 0.3s ease, background-color 0.3s ease;
        }

        .chatbot:hover {
            transform: scale(1.1);
            background-color: #0056b3;
        }

        #chatWindow {
            position: fixed;
            bottom: 80px;
            right: 20px;
            width: 360px;
            background-color: #ffffff;
            border: 1px solid #007bff;
            border-radius: 10px;
            box-shadow: 0px 4px 20px rgba(0, 0, 0, 0.3);
            overflow: hidden;
            display: none;
            animation: fadeIn 0.5s ease;
            z-index: 1000;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .chat-header {
            background-color: #007bff;
            color: white;
            padding: 12px;
            font-weight: bold;
            text-align: center;
            font-size: 18px;
            border-top-left-radius: 10px;
            border-top-right-radius: 10px;
        }

        #chatBody {
            max-height: 400px;
            overflow-y: auto;
            padding: 15px;
            background: #f4f4f9;
            color: #444;
        }

        .chat-message {
            margin: 5px 0;
            font-size: 15px;
            padding: 10px 12px;
            border-radius: 10px;
            max-width: 75%;
            line-height: 1.4;
            position: relative;
        }

        .user {
            text-align: right;
            background-color: #007bff;
            color: white;
            margin-left: auto;
            border-radius: 10px 10px 0 10px;
        }

        .bot {
            text-align: left;
            background-color: #e9ecef;
            color: #333;
            border-radius: 10px 10px 10px 0;
        }

        #chatInput {
            border: 1px solid #007bff;
            border-radius: 5px;
            padding: 10px;
            width: calc(100% - 24px);
            margin: 10px 0;
            font-size: 16px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            transition: border-color 0.3s;
        }

        #chatInput:focus {
            border-color: #0056b3;
            outline: none;
            box-shadow: 0 0 5px rgba(0, 123, 255, 0.5);
        }

        .keywords-button {
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 5px;
            padding: 10px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 10px;
            transition: background-color 0.3s ease;
            display: block;
            width: calc(100% - 30px);
            margin-left: 15px;
        }

        .keywords-button:hover {
            background-color: #218838;
        }

        .popup {
            display: none;
            position: fixed;
            bottom: 100px;
            right: 20px;
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 5px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            max-height: 250px;
            overflow-y: auto;
            padding: 10px;
            width: 280px;
            z-index: 1000;
        }

        .popup .keyword {
            padding: 8px;
            cursor: pointer;
            color: #4CAF50;
            border-bottom: 1px solid #eee;
            transition: background-color 0.2s;
        }

        .popup .keyword:hover {
            background-color: #f1f1f1;
        }

        .dropdown-suggestions {
            position: absolute;
            bottom: 60px;
            width: calc(100% - 24px);
            background-color: white;
            border: 1px solid #ddd;
            border-radius: 5px;
            max-height: 100px;
            overflow-y: auto;
            display: none;
            z-index: 999;
        }

        .dropdown-suggestions div {
            padding: 8px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .dropdown-suggestions div:hover {
            background-color: #f4f4f9;
        }

        .typing-indicator {
            font-size: 14px;
            color: #007bff;
            margin-left: 10px;
        }

        .mic-button {
            background-color: #ffc107;
            border: none;
            border-radius: 5px;
            padding: 10px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 10px;
            display: block;
            width: calc(100% - 30px);
            margin-left: 15px;
            transition: background-color 0.3s ease;
        }

        .mic-button:hover {
            background-color: #e0a800;
        }
    </style>
</head>
<body>

<div class="chatbot" onclick="toggleChat()">🤖</div>

<div id="chatWindow">
    <div class="chat-header">UPS BOT</div>
    <div id="chatBody"></div>
    <input type="text" id="chatInput" placeholder="Type your message" onkeypress="handleKey(event)">
    <button class="keywords-button" onclick="toggleKeywords()">Show Keywords</button>
    <button class="mic-button" onclick="startRecognition()">🎤</button>
    <div id="suggestions" class="dropdown-suggestions"></div>
</div>

<div id="keywordsPopup" class="popup">
    <strong>Available Keywords:</strong>
    <div id="keywordsList"></div>
</div>

<script>
    const keywords = [
        "academic", "admission", "extracurricular", "activities", "facilities", "campus", 
        "events", "calendar", "library", "career", "courses", "staff", "schedule", "enrollment", 
        "tuition", "sports", "clubs", "transportation", "health", "nutrition", "guidance", 
        "scholarships", "assessment", "reports", "parents", "communication", "volunteers", 
        "workshops", "seminars", "tutoring", "mentoring", "students", "community service", 
        "field trips", "performances", "arts", "theater", "music", "technology", "labs", 
        "certifications", "graduation", "tuition assistance", "fees", "policies", "student life", 
        "counseling"
    ];

    const responses = {
        "academic": "Our academic programs provide comprehensive education with a focus on critical thinking and real-world applications.",
        "admission": "Admissions are open! Apply online or visit the admissions office for more info about our programs and requirements.",
        "extracurricular": "We offer various extracurricular activities like sports, music, drama, and clubs that enhance student life.",
        "facilities": "Our facilities include a library, science labs, computer labs, sports fields, and an art studio designed for creativity.",
        "events": "We host events throughout the year, including cultural fests, sports meets, and community service initiatives.",
        "calendar": "The academic calendar is available on our website, with all important dates for the semester, including holidays.",
        "library": "Our library has thousands of books, journals, and digital resources, as well as study spaces for students.",
        "career": "Our career guidance program helps students explore their interests and prepares them for future career paths.",
        "courses": "We offer a variety of courses in different disciplines to cater to our students' diverse interests.",
        "staff": "Our dedicated staff is committed to student success.",
        "schedule": "Class schedules are provided at the beginning of each semester and are also available online.",
        "enrollment": "Enrollment is easy! You can find detailed steps on our website or contact the admissions office.",
        "tuition": "Tuition fees are outlined on our website, along with information about financial aid and scholarships.",
        "sports": "We offer a variety of sports, including soccer, basketball, and track, promoting physical fitness and teamwork.",
        "clubs": "Our clubs cover a variety of interests, from STEM to arts, allowing students to explore their passions.",
        "transportation": "We provide safe transportation options for students, including bus services and carpool programs.",
        "health": "We prioritize student health and wellness with health services, counseling, and nutrition programs.",
        "nutrition": "Healthy meals are provided at our cafeteria, focusing on balanced nutrition to fuel student learning.",
        "guidance": "Counseling services are available for academic and personal support throughout the school year.",
        "scholarships": "We offer various scholarships for eligible students to help them with their educational expenses.",
        "assessment": "Student assessments are conducted regularly to monitor progress and provide feedback for improvement.",
        "reports": "Report cards are distributed each term, highlighting academic achievements and areas for growth.",
        "parents": "Parent-teacher conferences are held regularly to discuss student progress and ways to support learning.",
        "communication": "We value open communication with parents and students, providing regular updates through newsletters and meetings.",
        "volunteers": "We welcome volunteers to assist with events and activities, enhancing the community spirit.",
        "workshops": "We organize workshops on various topics, including study skills, career planning, and personal development.",
        "seminars": "Guest speakers and seminars provide insights into different fields and inspire students.",
        "tutoring": "Tutoring is available for students needing extra help in specific subjects or skills.",
        "mentoring": "Mentoring programs connect students with experienced individuals for guidance and support.",
        "students": "We foster a positive environment where students can thrive academically and socially.",
        "community service": "Community service projects are part of our curriculum, encouraging students to give back.",
        "field trips": "Educational field trips enhance learning experiences and connect classroom knowledge to real-world applications.",
        "performances": "Our school organizes performances in music, dance, and theater, showcasing student talents.",
        "arts": "The arts are integral to our curriculum, promoting creativity and self-expression.",
        "theater": "Theater programs encourage students to explore acting and production skills through various performances.",
        "music": "Our music program offers lessons and opportunities to participate in school bands and orchestras.",
        "technology": "We incorporate technology into learning through various digital tools and resources.",
        "labs": "Science and computer labs are equipped with modern facilities to support hands-on learning.",
        "certifications": "Students can earn certifications in various fields, enhancing their career readiness.",
        "graduation": "Graduation ceremonies celebrate student achievements, and details are provided in advance.",
        "tuition assistance": "Tuition assistance programs are available for qualifying families, ensuring access to education.",
        "fees": "All fees are listed on our website, along with payment options and deadlines.",
        "policies": "School policies are communicated clearly to ensure a safe and conducive learning environment.",
        "student life": "Student life is vibrant, with numerous opportunities for involvement, growth, and connection.",
        "counseling": "Our counseling services are confidential and available for students seeking support."
    };

    let chatVisible = false;
    const chatBody = document.getElementById('chatBody');
    const chatInput = document.getElementById('chatInput');
    const keywordsPopup = document.getElementById('keywordsPopup');
    const keywordsList = document.getElementById('keywordsList');
    const suggestions = document.getElementById('suggestions');

    function toggleChat() {
        chatVisible = !chatVisible;
        document.getElementById('chatWindow').style.display = chatVisible ? 'block' : 'none';
        if (chatVisible) {
            displayGreeting();
        }
    }

    function displayGreeting() {
        const greetings = [
            "Hello! How can I assist you today? 😊",
            "Hi there! What information do you need? 👋",
            "Welcome back! How can I help you? 😄",
            "Hey! Got any questions for me? 🤔"
        ];
        const greetingMessage = greetings[Math.floor(Math.random() * greetings.length)];
        appendMessage('bot', greetingMessage);
    }

    function appendMessage(sender, message) {
        const messageElement = document.createElement('div');
        messageElement.className = `chat-message ${sender}`;
        messageElement.textContent = message;
        chatBody.appendChild(messageElement);
        chatBody.scrollTop = chatBody.scrollHeight;
    }

    function handleKey(event) {
        if (event.key === 'Enter') {
            const userInput = chatInput.value.trim();
            if (userInput) {
                appendMessage('user', userInput);
                chatInput.value = '';
                appendMessage('bot', '...'); // Typing indicator
                handleUserInput(userInput);
            }
        } else {
            showSuggestions(event);
        }
    }

    function showSuggestions(event) {
        const input = event.target.value.toLowerCase();
        suggestions.innerHTML = '';
        if (input) {
            const filteredKeywords = keywords.filter(keyword => keyword.startsWith(input));
            filteredKeywords.forEach(keyword => {
                const suggestionElement = document.createElement('div');
                suggestionElement.textContent = keyword;
                suggestionElement.onclick = () => selectSuggestion(keyword);
                suggestions.appendChild(suggestionElement);
            });
            suggestions.style.display = filteredKeywords.length ? 'block' : 'none';
        } else {
            suggestions.style.display = 'none';
        }
    }

    function selectSuggestion(keyword) {
        chatInput.value = keyword;
        suggestions.style.display = 'none';
    }

    function handleUserInput(userInput) {
        const response = responses[userInput.toLowerCase()];
        if (response) {
            setTimeout(() => appendMessage('bot', response), 1000); // Simulate typing delay
        } else {
            setTimeout(() => appendMessage('bot', "I'm sorry, I didn't understand that. Can you please ask differently? 😊"), 1000);
        }
    }

    function toggleKeywords() {
        keywordsPopup.style.display = keywordsPopup.style.display === 'block' ? 'none' : 'block';
        if (keywordsPopup.style.display === 'block') {
            displayKeywords();
        }
    }

    function displayKeywords() {
        keywordsList.innerHTML = '';
        keywords.forEach(keyword => {
            const keywordElement = document.createElement('div');
            keywordElement.className = 'keyword';
            keywordElement.textContent = keyword;
            keywordElement.onclick = () => {
                chatInput.value = keyword;
                keywordsPopup.style.display = 'none';
                appendMessage('user', keyword);
                handleUserInput(keyword);
            };
            keywordsList.appendChild(keywordElement);
        });
    }

    function startRecognition() {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) {
            alert("Your browser doesn't support speech recognition.");
            return;
        }

        const recognition = new SpeechRecognition();
        recognition.lang = 'en-US';
        recognition.interimResults = false;

        recognition.onstart = function() {
            appendMessage('bot', "Listening... 🗣️");
        };

        recognition.onresult = function(event) {
            const transcript = event.results[0][0].transcript;
            appendMessage('user', transcript);
            handleUserInput(transcript);
        };

        recognition.onerror = function(event) {
            appendMessage('bot', "Sorry, I couldn't hear you. Please try again. 🙁");
        };

        recognition.onend = function() {
            appendMessage('bot', "Stopped listening. You can speak again by clicking the mic button. 🎤");
        };

        recognition.start();
    }
</script>

</body>
</html>
